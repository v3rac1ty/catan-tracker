x-app-image: &app_image
  build: .
  image: catan-tracker:local

x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default_logging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - catan_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/roles.sql:/db/roles.sql:ro
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app_image
    logging: *default_logging
    command: ["python", "-m", "catan_bot.db.migrate"]
    environment:
      MIGRATOR_DATABASE_URL: postgresql://catan_migrator:${MIGRATOR_PASSWORD}@db:5432/catan
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app_image
    logging: *default_logging
    environment:
      DATABASE_URL: postgresql://catan_app:${APP_PASSWORD}@db:5432/catan
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DEV_GUILD_ID: ${DEV_GUILD_ID:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  catan_db_data:
